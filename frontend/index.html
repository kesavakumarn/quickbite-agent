<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QuickBite — Gen Z Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0c10;
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
      --primary: #ff2a85; /* Cyber Pink */
      --secondary: #8a2be2; /* Neon Purple */
      --text-main: #f8f8f2;
      --text-muted: #a1a1aa;
      --success: #00e676;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Floating Neon Orbs for Glassmorphism Effect */
    body::before, body::after {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      filter: blur(120px);
      z-index: -1;
      opacity: 0.5;
      animation: float 10s infinite alternate ease-in-out;
    }
    body::before {
      background: var(--primary);
      top: -100px;
      left: -100px;
    }
    body::after {
      background: var(--secondary);
      bottom: -100px;
      right: -100px;
      animation-delay: -5s;
    }

    @keyframes float {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(30px) scale(1.1); }
    }
    
    header {
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(11, 12, 16, 0.6);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    
    .brand {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .sub { 
      color: var(--text-muted); 
      font-size: 14px; 
      font-weight: 600;
      background: var(--glass-bg);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--glass-border);
    }
    
    .layout {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 24px;
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 24px;
    }
    
    @media (max-width: 820px) { 
      .layout { grid-template-columns: 1fr; margin: 20px auto; gap: 20px; padding: 0 16px; } 
    }
    
    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .chat-panel {
      display: flex;
      flex-direction: column;
      height: 600px;
      overflow: hidden;
    }
    
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    /* Sleek Custom Scrollbar */
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    
    .msg {
      max-width: 85%;
      padding: 14px 18px;
      border-radius: 20px;
      font-size: 15px;
      line-height: 1.5;
      animation: fadeIn 0.3s ease;
      word-wrap: break-word;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .msg.bot { 
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      align-self: flex-start; 
      border-bottom-left-radius: 4px;
      border: 1px solid var(--glass-border);
    }
    
    .msg.user { 
      background: linear-gradient(135deg, var(--primary), var(--secondary)); 
      color: white;
      align-self: flex-end; 
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 15px rgba(255, 42, 133, 0.3);
    }
    
    .composer { 
      display: flex; 
      align-items: stretch; 
      gap: 12px; 
      padding: 20px; 
      background: rgba(0, 0, 0, 0.2);
      border-top: 1px solid var(--glass-border); 
    }
    
    .composer input {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      padding: 14px 18px;
      border-radius: 16px;
      font-family: inherit;
      font-size: 15px;
      transition: all 0.2s;
      min-width: 0; 
    }
    
    .composer input:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.08);
    }
    
    .composer input::placeholder { color: #6b6b76; }
    
    .composer button {
      background: var(--text-main);
      color: var(--bg-color);
      border: none;
      font-weight: 800;
      padding: 0 24px;
      border-radius: 16px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .composer button:hover {
      background: var(--primary);
      color: white;
      transform: translateY(-2px);
    }
    
    .composer button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    .ticket {
      padding: 32px;
      position: relative;
    }
    
    .ticket h2 { 
      font-weight: 800;
      margin: 0 0 24px; 
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .ticket h2::before {
      content: '🛒';
      font-size: 20px;
    }
    
    .line-item { 
      display: flex; 
      justify-content: space-between; 
      margin: 12px 0; 
      color: var(--text-muted);
      font-size: 15px;
    }
    
    .total-row { 
      display: flex; 
      justify-content: space-between; 
      font-weight: 800; 
      font-size: 22px; 
      margin-top: 24px; 
      border-top: 1px dashed rgba(255, 255, 255, 0.1); 
      padding-top: 20px; 
      color: var(--text-main);
    }
    
    #payment-section {
      display: none;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--glass-border);
      text-align: center;
    }
    
    #payment-section p {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 16px;
    }
    
    .qr-container {
      background: white;
      padding: 10px;
      border-radius: 16px;
      display: inline-block;
      margin-bottom: 16px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
    }
    
    .gpay-btn, .confirm-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      font-weight: 800;
      font-family: inherit;
      text-align: center;
      box-sizing: border-box;
      transition: all 0.2s;
    }
    
    .gpay-btn {
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      color: white;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(138, 43, 226, 0.3);
    }
    
    .gpay-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(138, 43, 226, 0.5);
    }
    
    .confirm-btn {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      border: 1px solid var(--glass-border);
      margin-top: 12px;
      cursor: not-allowed;
    }
    
    .stamp {
      display: none;
      position: absolute;
      top: 24px;
      right: 24px;
      border: 2px solid var(--success);
      color: var(--success);
      font-weight: 800;
      padding: 6px 12px;
      transform: rotate(12deg);
      border-radius: 12px;
      letter-spacing: 0.05em;
      background: rgba(0, 230, 118, 0.1);
      backdrop-filter: blur(4px);
    }

    @media (max-width: 480px) {
      header { padding: 16px 20px; }
      .brand { font-size: 22px; }
      .chat-panel { height: 500px; }
      .composer { padding: 16px 12px; gap: 8px; }
      .composer button { padding: 0 16px; }
      .ticket { padding: 24px 20px; }
    }
  </style>
</head>
<body>

<header>
  <div class="brand">QUICKBITE ✨</div>
  <div class="sub">Zero cap. Just snacks.</div>
</header>

<div class="layout">
  <div class="glass-panel chat-panel">
    <div class="messages" id="messages"></div>
    <div class="composer">
      <input id="input" type="text" placeholder="Spill the tea on what you want..." autocomplete="off"/>
      <button id="send">Send</button>
    </div>
  </div>

  <div>
    <div class="glass-panel ticket">
      <div class="stamp" id="stamp">VIBE SECURED</div>
      <h2>Your Cart</h2>
      <div id="cart-lines"><p style="color:#6b6b76; font-style: italic;">No cap, it's looking empty in here...</p></div>
      <div class="total-row">
        <span>Total</span>
        <span id="total">₹0</span>
      </div>

      <div id="payment-section">
        <p>Scan or tap below to secure the bag 💸</p>
        <div class="qr-container">
          <img id="qr-img" src="" alt="UPI QR" style="width:140px; height:140px; display:block;" />
        </div>
        <a id="gpay-link" href="#" class="gpay-btn">Pay via GPay, PhonePe, Paytm</a>
        <!-- Status indicator button -->
        <button id="confirm-pay-btn" class="confirm-btn" disabled>Awaiting Payment Drop...</button>
      </div>
    </div>
  </div>
</div>

<script>
  const BACKEND_URL = "https://quickbite-agent.onrender.com";
  const sessionId = crypto.randomUUID ? crypto.randomUUID() : String(Math.random());

  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const cartLinesEl = document.getElementById("cart-lines");
  const totalEl = document.getElementById("total");
  const paymentSection = document.getElementById("payment-section");
  const qrImg = document.getElementById("qr-img");
  const gpayLink = document.getElementById("gpay-link");

  let currentOrder = null;
  let latestCustomerDetails = {};

  function addMessage(text, who) {
    const div = document.createElement("div");
    div.className = "msg " + who;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function renderCart(cart, total) {
    cartLinesEl.innerHTML = "";
    if (!cart || !cart.length) {
      cartLinesEl.innerHTML = '<p style="color:#6b6b76; font-style: italic;">No cap, it\'s looking empty in here...</p>';
    } else {
      cart.forEach(item => {
        const row = document.createElement("div");
        row.className = "line-item";
        row.innerHTML = `<span>${item.qty}x ${item.name}</span><span>₹${item.price * item.qty}</span>`;
        cartLinesEl.appendChild(row);
      });
    }
    totalEl.textContent = "₹" + total;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    
    // Display the clean message to the user
    addMessage(text, "user");
    inputEl.value = "";
    sendBtn.disabled = true;

    // We send EXACTLY what the user typed to avoid crashing the AI API
    const backendPayload = text; 

    try {
      const res = await fetch(`${BACKEND_URL}/api/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId, message: backendPayload })
      });
      
      const data = await res.json();
      
      if (data.error) {
        addMessage("Whoops! Connection error: " + data.error, "bot");
      } else {
        addMessage(data.reply, "bot");
        renderCart(data.cart, data.total);
        
        if (data.customerDetails) {
            latestCustomerDetails = { ...latestCustomerDetails, ...data.customerDetails };
        }

        if (data.readyToCheckout) {
          triggerCheckout();
        }
      }
    } catch (e) {
      addMessage("Connection error to server. Are we offline? 😭", "bot");
    } finally {
      sendBtn.disabled = false;
    }
  }

  async function triggerCheckout() {
    try {
      const res = await fetch(`${BACKEND_URL}/api/checkout`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId, customerDetails: latestCustomerDetails })
      });
      const data = await res.json();
      if (data.error) return alert(data.error);

      currentOrder = data;
      qrImg.src = data.qrCodeUrl;
      gpayLink.href = data.upiUrl;
      paymentSection.style.display = "block";
      addMessage("Main character energy! 💅 Just tap the button on the right to clear the bill and we'll start cooking.", "bot");
    } catch (e) {
      console.error(e);
    }
  }

  sendBtn.onclick = sendMessage;
  inputEl.onkeydown = (e) => { if (e.key === "Enter") sendMessage(); };

  addMessage("Hey bestie! ✨ What are we craving today? Drop your order below.", "bot");
</script>
</body>
</html>
