<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CraveDrop — AI Chat Ordering</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --panel: #18181b;
      --primary: #a855f7; /* Neon Purple */
      --primary-hover: #9333ea;
      --secondary: #06b6d4; /* Cyan */
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --card-bg: #1f1f22;
      --border: #27272a;
      --success: #10b981;
    }
    
    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      background-image: radial-gradient(circle at top right, rgba(168, 85, 247, 0.1), transparent 40%),
                        radial-gradient(circle at bottom left, rgba(6, 182, 212, 0.05), transparent 40%);
    }
    
    header {
      padding: 24px 32px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(9, 9, 11, 0.8);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    
    .brand {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.05em;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .sub { 
      color: var(--text-muted); 
      font-size: 14px; 
      font-weight: 600;
    }
    
    .layout {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 32px;
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 24px;
    }
    
    @media (max-width: 820px) { .layout { grid-template-columns: 1fr; margin: 20px auto; } }
    
    .chat-panel {
      background: var(--panel);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      height: 600px;
      border: 1px solid var(--border);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      overflow: hidden;
    }
    
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    /* Custom Scrollbar for a cleaner look */
    .messages::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    
    .msg {
      max-width: 80%;
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.5;
      animation: fadeIn 0.3s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .msg.bot { 
      background: var(--card-bg); 
      color: var(--text-main);
      align-self: flex-start; 
      border-bottom-left-radius: 4px;
      border: 1px solid var(--border);
    }
    
    .msg.user { 
      background: linear-gradient(135deg, var(--primary), #7e22ce); 
      color: white;
      align-self: flex-end; 
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
    }
    
    .composer { 
      display: flex; 
      gap: 12px; 
      padding: 20px; 
      background: var(--card-bg);
      border-top: 1px solid var(--border); 
    }
    
    .composer input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 14px 18px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 15px;
      transition: all 0.2s;
    }
    
    .composer input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(168, 85, 247, 0.2);
    }
    
    .composer input::placeholder { color: #52525b; }
    
    .composer button {
      background: var(--text-main);
      color: var(--bg);
      border: none;
      font-weight: 800;
      padding: 0 24px;
      border-radius: 12px;
      cursor: pointer;
      font-family: 'Space Grotesk', sans-serif;
      transition: all 0.2s;
    }
    
    .composer button:hover {
      background: var(--primary);
      color: white;
      transform: translateY(-2px);
    }
    
    .composer button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    .ticket {
      background: var(--card-bg);
      color: var(--text-main);
      border-radius: 20px;
      padding: 32px;
      position: relative;
      border: 1px solid var(--border);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    
    .ticket h2 { 
      font-family: 'Space Grotesk', sans-serif; 
      margin: 0 0 24px; 
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .ticket h2::before {
      content: '';
      display: inline-block;
      width: 10px;
      height: 10px;
      background: var(--secondary);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--secondary);
    }
    
    .line-item { 
      display: flex; 
      justify-content: space-between; 
      margin: 12px 0; 
      color: var(--text-muted);
      font-size: 15px;
    }
    
    .total-row { 
      display: flex; 
      justify-content: space-between; 
      font-weight: 800; 
      font-size: 22px; 
      margin-top: 24px; 
      border-top: 1px dashed #3f3f46; 
      padding-top: 20px; 
      color: var(--text-main);
    }
    
    #payment-section {
      display: none;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      text-align: center;
    }
    
    #payment-section p {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 16px;
    }
    
    .qr-container {
      background: white;
      padding: 10px;
      border-radius: 12px;
      display: inline-block;
      margin-bottom: 16px;
    }
    
    .gpay-btn {
      display: block;
      width: 100%;
      background: var(--text-main);
      color: var(--bg);
      padding: 14px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 800;
      font-family: 'Space Grotesk', sans-serif;
      transition: all 0.2s;
    }
    
    .gpay-btn:hover {
      background: var(--secondary);
      color: white;
      box-shadow: 0 4px 15px rgba(6, 182, 212, 0.4);
    }
    
    .confirm-btn {
      width: 100%;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
      margin-top: 12px;
      cursor: not-allowed;
      opacity: 0.5;
    }
    
    .stamp {
      display: none;
      position: absolute;
      top: 24px;
      right: 24px;
      border: 2px solid var(--success);
      color: var(--success);
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      padding: 6px 12px;
      transform: rotate(12deg);
      border-radius: 8px;
      letter-spacing: 0.05em;
      background: rgba(16, 185, 129, 0.1);
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>

<header>
  <div class="brand">CRAVEDROP</div>
  <div class="sub">Zero cap. Just snacks. 🚀</div>
</header>

<div class="layout">
  <div class="chat-panel">
    <div class="messages" id="messages"></div>
    <div class="composer">
      <input id="input" type="text" placeholder="e.g. Drop 2 spicy chicken sliders fr fr..." autocomplete="off"/>
      <button id="send">Send</button>
    </div>
  </div>

  <div>
    <div class="ticket">
      <div class="stamp" id="stamp">VIBE SECURED</div>
      <h2>Order Status</h2>
      <div id="cart-lines"><p style="color:#52525b; font-style: italic;">Cart is looking empty rn...</p></div>
      <div class="total-row">
        <span>Total</span>
        <span id="total">₹0</span>
      </div>

      <div id="payment-section">
        <p>Scan or tap to clear the bill via Any UPI App</p>
        <div class="qr-container">
          <img id="qr-img" src="" alt="UPI QR" style="width:140px; height:140px; display:block;" />
        </div>
        <a id="gpay-link" href="#" class="gpay-btn">Pay via GPay, PhonePe, Paytm</a>
        <!-- Disabled dummy button -->
        <button id="confirm-pay-btn" class="confirm-btn" disabled>Awaiting Payment Drop...</button>
      </div>
    </div>
  </div>
</div>

<script>
  const BACKEND_URL = "https://quickbite-agent.onrender.com";
  const sessionId = crypto.randomUUID ? crypto.randomUUID() : String(Math.random());

  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const cartLinesEl = document.getElementById("cart-lines");
  const totalEl = document.getElementById("total");
  const paymentSection = document.getElementById("payment-section");
  const qrImg = document.getElementById("qr-img");
  const gpayLink = document.getElementById("gpay-link");

  let currentOrder = null;
  let latestCustomerDetails = {};

  function addMessage(text, who) {
    const div = document.createElement("div");
    div.className = "msg " + who;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function renderCart(cart, total) {
    cartLinesEl.innerHTML = "";
    if (!cart || !cart.length) {
      cartLinesEl.innerHTML = '<p style="color:#52525b; font-style: italic;">Cart is looking empty rn...</p>';
    } else {
      cart.forEach(item => {
        const row = document.createElement("div");
        row.className = "line-item";
        row.innerHTML = `<span>${item.qty}x ${item.name}</span><span>₹${item.price * item.qty}</span>`;
        cartLinesEl.appendChild(row);
      });
    }
    totalEl.textContent = "₹" + total;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    
    // Display the clean message to the user
    addMessage(text, "user");
    inputEl.value = "";
    sendBtn.disabled = true;

    // Use a lighter hint to nudge the AI without breaking the backend API
    let backendPayload = text + " (Note: Ask for only one missing detail next. Keep your response casual and brief.)";

    try {
      const res = await fetch(`${BACKEND_URL}/api/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId, message: backendPayload })
      });
      
      const data = await res.json();
      
      if (data.error) {
        addMessage("Error: " + data.error, "bot");
      } else {
        addMessage(data.reply, "bot");
        renderCart(data.cart, data.total);
        
        if (data.customerDetails) {
            latestCustomerDetails = { ...latestCustomerDetails, ...data.customerDetails };
        }

        if (data.readyToCheckout) {
          triggerCheckout();
        }
      }
    } catch (e) {
      addMessage("Connection error to server: " + e.message, "bot");
    } finally {
      sendBtn.disabled = false;
    }
  }

  async function triggerCheckout() {
    try {
      const res = await fetch(`${BACKEND_URL}/api/checkout`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId, customerDetails: latestCustomerDetails })
      });
      const data = await res.json();
      if (data.error) return alert(data.error);

      currentOrder = data;
      qrImg.src = data.qrCodeUrl;
      gpayLink.href = data.upiUrl;
      paymentSection.style.display = "block";
      addMessage("Your vibe is secured! 🍕 Just clear the bill using the QR or button on the right, and we'll get cooking.", "bot");
    } catch (e) {
      console.error(e);
    }
  }

  sendBtn.onclick = sendMessage;
  inputEl.onkeydown = (e) => { if (e.key === "Enter") sendMessage(); };

  // New GenZ bot greeting
  addMessage("Yo! What's the vibe today? Drop your cravings below and let's get you fed.", "bot");
</script>
</body>
</html>
