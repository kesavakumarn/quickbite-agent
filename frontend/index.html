<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Added maximum-scale=1 to prevent mobile keyboards from zooming and breaking the UI -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>QuickBite — Premium Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b; /* Pitch dark */
      --surface: #18181b; /* Slightly lighter card */
      --border: #27272a;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --primary: #8b5cf6; /* Vibrant Violet */
      --secondary: #ec4899; /* Vibrant Pink */
      --success: #10b981;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    
    /* Header - Fixed & Sleek */
    header {
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(9, 9, 11, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    
    .brand {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.04em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-text {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .sub { 
      color: var(--text-muted); 
      font-size: 13px; 
      font-weight: 600;
      background: var(--surface);
      padding: 6px 12px;
      border-radius: 100px;
      border: 1px solid var(--border);
    }
    
    /* Layout Setup */
    .layout {
      display: flex;
      flex-direction: row;
      gap: 24px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
      width: 100%;
      height: calc(100vh - 70px); /* Fill remaining viewport on desktop */
    }
    
    .bento-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* Chat Section */
    .chat-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    .messages::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    
    .msg {
      max-width: 85%;
      padding: 14px 18px;
      border-radius: 20px;
      font-size: 15px;
      line-height: 1.5;
      word-wrap: break-word;
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .msg.bot { 
      background: #27272a;
      color: var(--text-main);
      align-self: flex-start; 
      border-bottom-left-radius: 4px;
    }
    
    .msg.user { 
      background: linear-gradient(135deg, var(--primary), var(--secondary)); 
      color: white;
      align-self: flex-end; 
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.25);
    }
    
    .composer { 
      display: flex; 
      gap: 10px; 
      padding: 16px; 
      background: var(--surface);
      border-top: 1px solid var(--border);
    }
    
    .composer input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0 18px;
      border-radius: 100px;
      font-family: inherit;
      font-size: 15px;
      min-width: 0; 
      transition: border-color 0.2s;
    }
    
    .composer input:focus {
      outline: none;
      border-color: var(--primary);
    }
    
    .composer input::placeholder { color: #52525b; }
    
    .composer button {
      background: var(--text-main);
      color: var(--bg);
      border: none;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 100px;
      cursor: pointer;
      font-family: inherit;
      font-size: 15px;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    
    .composer button:hover {
      background: var(--primary);
      color: white;
    }
    
    .composer button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    /* Cart / Ticket Section */
    .cart-section {
      width: 380px;
      flex-shrink: 0;
      padding: 32px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      position: relative;
    }

    .cart-section::-webkit-scrollbar { display: none; }
    
    .cart-section h2 { 
      font-weight: 700;
      font-size: 18px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-main);
    }
    
    .line-item { 
      display: flex; 
      justify-content: space-between; 
      margin: 14px 0; 
      color: var(--text-muted);
      font-size: 15px;
      font-weight: 500;
    }
    
    .total-row { 
      display: flex; 
      justify-content: space-between; 
      font-weight: 700; 
      font-size: 20px; 
      margin-top: 24px; 
      border-top: 1px dashed var(--border); 
      padding-top: 20px; 
      color: var(--text-main);
    }
    
    #payment-section {
      display: none;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      text-align: center;
      animation: slideUp 0.4s ease;
    }
    
    #payment-section p {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 16px;
      font-weight: 500;
    }
    
    .qr-container {
      background: white;
      padding: 12px;
      border-radius: 16px;
      display: inline-block;
      margin-bottom: 20px;
    }
    
    .gpay-btn {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      padding: 16px;
      border-radius: 100px;
      font-weight: 700;
      text-decoration: none;
      text-align: center;
      transition: opacity 0.2s;
    }
    
    .gpay-btn:hover { opacity: 0.9; }
    
    .confirm-btn {
      display: block;
      width: 100%;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 100px;
      font-weight: 600;
      margin-top: 12px;
      cursor: not-allowed;
      text-align: center;
    }
    
    .stamp {
      display: none;
      position: absolute;
      top: 24px;
      right: 24px;
      border: 1px solid var(--success);
      color: var(--success);
      font-weight: 700;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 100px;
      background: rgba(16, 185, 129, 0.1);
    }

    /* -------------------------------------------
       MOBILE RESPONSIVENESS
       ------------------------------------------- */
    @media (max-width: 820px) {
      .layout { 
        flex-direction: column; 
        padding: 16px; 
        height: auto; /* Allow natural scrolling */
        gap: 16px;
      }
      
      .chat-section {
        /* On mobile, limit chat height so it doesn't take over the entire page */
        height: 65vh; 
        min-height: 400px; 
      }
      
      .cart-section {
        width: 100%;
        overflow-y: visible; /* Let it expand fully on mobile */
      }
      
      header { padding: 12px 16px; }
      .brand { font-size: 20px; }
      .sub { display: none; /* Hide sub badge on small screens to save space */ }
      
      .composer { padding: 12px; }
      .composer input { padding: 12px 16px; }
      .composer button { padding: 12px 20px; }
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
    🍔 <span class="brand-text">QuickBite</span>
  </div>
  <div class="sub">AI Ordering Active</div>
</header>

<div class="layout">
  <!-- Chat Section -->
  <div class="bento-box chat-section">
    <div class="messages" id="messages"></div>
    <div class="composer">
      <input id="input" type="text" placeholder="Type your order here..." autocomplete="off"/>
      <button id="send">Send</button>
    </div>
  </div>

  <!-- Cart Section -->
  <div class="bento-box cart-section">
    <div class="stamp" id="stamp">CONFIRMED</div>
    <h2>Order Summary</h2>
    <div id="cart-lines"><p style="color:#52525b; font-style: italic; font-size: 14px;">Your cart is empty.</p></div>
    
    <div class="total-row">
      <span>Total</span>
      <span id="total">₹0</span>
    </div>

    <!-- Hidden until checkout is ready -->
    <div id="payment-section">
      <p>Scan to complete your payment</p>
      <div class="qr-container">
        <img id="qr-img" src="" alt="UPI QR" style="width:140px; height:140px; display:block;" />
      </div>
      <a id="gpay-link" href="#" class="gpay-btn">Pay via GPay, PhonePe, Paytm</a>
      <button id="confirm-pay-btn" class="confirm-btn" disabled>Awaiting Payment...</button>
    </div>
  </div>
</div>

<script>
  const BACKEND_URL = "https://quickbite-agent.onrender.com";
  // Generate session ID once
  const sessionId = crypto.randomUUID ? crypto.randomUUID() : String(Math.random());

  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const cartLinesEl = document.getElementById("cart-lines");
  const totalEl = document.getElementById("total");
  const paymentSection = document.getElementById("payment-section");
  const qrImg = document.getElementById("qr-img");
  const gpayLink = document.getElementById("gpay-link");

  let currentOrder = null;
  let latestCustomerDetails = {};

  function addMessage(text, who) {
    const div = document.createElement("div");
    div.className = "msg " + who;
    div.textContent = text;
    messagesEl.appendChild(div);
    // Smooth scroll to bottom
    messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
  }

  function renderCart(cart, total) {
    cartLinesEl.innerHTML = "";
    if (!cart || !cart.length) {
      cartLinesEl.innerHTML = '<p style="color:#52525b; font-style: italic; font-size: 14px;">Your cart is empty.</p>';
    } else {
      cart.forEach(item => {
        const row = document.createElement("div");
        row.className = "line-item";
        row.innerHTML = `<span>${item.qty}x ${item.name}</span><span>₹${item.price * item.qty}</span>`;
        cartLinesEl.appendChild(row);
      });
    }
    totalEl.textContent = "₹" + total;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    
    // Display user message
    addMessage(text, "user");
    inputEl.value = "";
    sendBtn.disabled = true;

    // Send exact text to avoid backend parsing crashes
    const backendPayload = text; 

    try {
      const res = await fetch(`${BACKEND_URL}/api/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId, message: backendPayload })
      });
      
      const data = await res.json();
      
      if (data.error) {
        addMessage("Whoops! Connection error: " + data.error, "bot");
      } else {
        addMessage(data.reply, "bot");
        renderCart(data.cart, data.total);
        
        if (data.customerDetails) {
            latestCustomerDetails = { ...latestCustomerDetails, ...data.customerDetails };
        }

        if (data.readyToCheckout) {
          triggerCheckout();
        }
      }
    } catch (e) {
      addMessage("Connection error to server. Please try again.", "bot");
    } finally {
      sendBtn.disabled = false;
      // Refocus input if on desktop
      if (window.innerWidth > 820) {
        inputEl.focus();
      }
    }
  }

  async function triggerCheckout() {
    try {
      const res = await fetch(`${BACKEND_URL}/api/checkout`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId, customerDetails: latestCustomerDetails })
      });
      const data = await res.json();
      if (data.error) return alert(data.error);

      currentOrder = data;
      qrImg.src = data.qrCodeUrl;
      gpayLink.href = data.upiUrl;
      paymentSection.style.display = "block";
      
      // Auto-scroll mobile view to the payment section
      if (window.innerWidth <= 820) {
        setTimeout(() => {
          paymentSection.scrollIntoView({ behavior: 'smooth' });
        }, 300);
      }

      addMessage("Perfect! I have captured your details. Please complete your payment below so we can start preparing your order.", "bot");
    } catch (e) {
      console.error(e);
    }
  }

  sendBtn.onclick = sendMessage;
  inputEl.onkeydown = (e) => { if (e.key === "Enter") sendMessage(); };

  // Initial greeting
  addMessage("Welcome to QuickBite! What would you like to order today?", "bot");
</script>
</body>
</html>
