<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QuickBite — AI Chat Ordering</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #181817;
      --panel: #222120;
      --paper: #fbf4de;
      --paper-line: #e3d9b8;
      --ink: #2b2822;
      --amber: #ffb100;
      --stamp: #27ae60;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: #eee;
      font-family: 'IBM Plex Mono', monospace;
      min-height: 100vh;
    }
    header {
      padding: 20px 28px;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      font-family: 'Oswald', sans-serif;
      font-size: 28px;
      color: var(--amber);
      letter-spacing: .05em;
    }
    .sub { color: #888; font-size: 12px; }
    .layout {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 24px;
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 20px;
    }
    @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
    .chat-panel {
      background: var(--panel);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      height: 580px;
      border: 1px solid #333;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
    }
    .msg.bot { background: #2c2b28; align-self: flex-start; border-left: 3px solid var(--amber); }
    .msg.user { background: #3d3118; align-self: flex-end; border-right: 3px solid var(--amber); }
    .composer { display: flex; gap: 8px; padding: 14px; border-top: 1px solid #333; }
    .composer input {
      flex: 1;
      background: #111;
      border: 1px solid #444;
      color: #eee;
      padding: 10px 12px;
      border-radius: 6px;
      font-family: inherit;
    }
    .composer button {
      background: var(--amber);
      border: none;
      color: #111;
      font-weight: bold;
      padding: 0 18px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Oswald', sans-serif;
      letter-spacing: .05em;
    }
    .ticket {
      background: var(--paper);
      color: var(--ink);
      border-radius: 4px;
      padding: 20px;
      font-size: 13px;
      position: relative;
      box-shadow: 0 8px 24px rgba(0,0,0,.4);
    }
    .ticket h2 { font-family: 'Oswald', sans-serif; margin: 0 0 10px; }
    .line-item { display: flex; justify-content: space-between; margin: 6px 0; }
    .total-row { display: flex; justify-content: space-between; font-weight: bold; font-size: 16px; margin-top: 12px; border-top: 1px dashed var(--paper-line); padding-top: 10px; }
    #payment-section {
      display: none;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 2px dashed #ccc;
      text-align: center;
    }
    .gpay-btn {
      display: inline-block;
      width: 100%;
      background: #000;
      color: #fff;
      padding: 12px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 10px;
      font-family: sans-serif;
    }
    .confirm-btn {
      width: 100%;
      background: var(--stamp);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      margin-top: 10px;
      cursor: not-allowed;
      opacity: 0.5;
    }
    .stamp {
      display: none;
      position: absolute;
      top: 15px;
      right: 15px;
      border: 3px solid var(--stamp);
      color: var(--stamp);
      font-family: 'Oswald', sans-serif;
      font-weight: bold;
      padding: 4px 10px;
      transform: rotate(8deg);
      border-radius: 4px;
    }
  </style>
</head>
<body>

<header>
  <div class="brand">QUICKBITE AI</div>
  <div class="sub">Pay Using UPI</div>
</header>

<div class="layout">
  <div class="chat-panel">
    <div class="messages" id="messages"></div>
    <div class="composer">
      <input id="input" type="text" placeholder="e.g. Add 2 Margherita pizzas..." autocomplete="off"/>
      <button id="send">Send</button>
    </div>
  </div>

  <div>
    <div class="ticket">
      <div class="stamp" id="stamp">CONFIRMED</div>
      <h2>ORDER SUMMARY</h2>
      <div id="cart-lines"><p style="color:#888;">Your cart is empty.</p></div>
      <div class="total-row">
        <span>Total</span>
        <span id="total">₹0</span>
      </div>

      <div id="payment-section">
        <p style="margin:0 0 8px 0; font-weight:bold;">Scan or Tap to Pay with Google Pay / UPI</p>
        <img id="qr-img" src="" alt="UPI QR" style="width:160px; height:160px; margin:auto;" />
        <a id="gpay-link" href="#" class="gpay-btn">Pay via Google Pay / UPI</a>
        <!-- Disabled dummy button per request -->
        <button id="confirm-pay-btn" class="confirm-btn" disabled>Payment Verification Pending...</button>
      </div>
    </div>
  </div>
</div>

<script>
  const BACKEND_URL = "https://quickbite-agent.onrender.com";
  const sessionId = crypto.randomUUID ? crypto.randomUUID() : String(Math.random());

  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const cartLinesEl = document.getElementById("cart-lines");
  const totalEl = document.getElementById("total");
  const paymentSection = document.getElementById("payment-section");
  const qrImg = document.getElementById("qr-img");
  const gpayLink = document.getElementById("gpay-link");

  let currentOrder = null;
  let latestCustomerDetails = {};
  let isFirstMessage = true; // Track first message to inject step-by-step instructions

  function addMessage(text, who) {
    const div = document.createElement("div");
    div.className = "msg " + who;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function renderCart(cart, total) {
    cartLinesEl.innerHTML = "";
    if (!cart || !cart.length) {
      cartLinesEl.innerHTML = '<p style="color:#888;">Your cart is empty.</p>';
    } else {
      cart.forEach(item => {
        const row = document.createElement("div");
        row.className = "line-item";
        row.innerHTML = `<span>${item.qty}x ${item.name}</span><span>₹${item.price * item.qty}</span>`;
        cartLinesEl.appendChild(row);
      });
    }
    totalEl.textContent = "₹" + total;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    
    // Display the clean message to the user
    addMessage(text, "user");
    inputEl.value = "";
    sendBtn.disabled = true;

    // Inject a hidden prompt on the very first message to force the AI to ask step-by-step
    let backendPayload = text;
    if (isFirstMessage) {
      backendPayload += "\n\n[System Instruction: For the rest of this conversation, ask for my details step-by-step. First ask for my order, then my Name, then my Mobile, then my Email, and finally my Address with Zipcode. Do NOT ask for them all at once.]";
      isFirstMessage = false;
    }

    try {
      const res = await fetch(`${BACKEND_URL}/api/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId, message: backendPayload })
      });
      const data = await res.json();
      if (data.error) {
        addMessage("Error: " + data.error, "bot");
      } else {
        addMessage(data.reply, "bot");
        renderCart(data.cart, data.total);
        if (data.customerDetails) latestCustomerDetails = data.customerDetails;

        if (data.readyToCheckout) {
          triggerCheckout();
        }
      }
    } catch (e) {
      addMessage("Connection error to server: " + e.message, "bot");
    } finally {
      sendBtn.disabled = false;
    }
  }

  async function triggerCheckout() {
    try {
      const res = await fetch(`${BACKEND_URL}/api/checkout`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId, customerDetails: latestCustomerDetails })
      });
      const data = await res.json();
      if (data.error) return alert(data.error);

      currentOrder = data;
      qrImg.src = data.qrCodeUrl;
      gpayLink.href = data.upiUrl;
      paymentSection.style.display = "block";
      addMessage("Your order details are captured! Please complete payment using the Google Pay QR / button on the right ticket.", "bot");
    } catch (e) {
      console.error(e);
    }
  }

  sendBtn.onclick = sendMessage;
  inputEl.onkeydown = (e) => { if (e.key === "Enter") sendMessage(); };

  // Updated initial prompt so the user isn't immediately overwhelmed
  addMessage("Hello! What would you like to order today?", "bot");
</script>
</body>
</html>
