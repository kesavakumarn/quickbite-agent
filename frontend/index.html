<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>QuickBite Ordering</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #FF5A5F; 
      --bg: #F3F4F6; 
      --surface: #FFFFFF;
      --text-main: #111827;
      --text-muted: #6B7280;
      --border: #E5E7EB;
      --success: #10B981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg); color: var(--text-main); font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    header { background: var(--surface); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); box-shadow: 0 1px 2px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 50; }
    .brand { font-size: 20px; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; }
    .sub { color: var(--text-muted); font-size: 13px; font-weight: 500; background: var(--bg); padding: 4px 10px; border-radius: 6px; }
    .layout { display: flex; flex-direction: row; gap: 24px; max-width: 1200px; margin: 0 auto; padding: 24px; width: 100%; height: calc(100vh - 65px); }
    .card { background: var(--surface); border-radius: 16px; border: 1px solid var(--border); }
    .chat-section { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .messages::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 10px; }
    .msg { max-width: 80%; padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.5; word-wrap: break-word; animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .msg.bot { background: var(--bg); color: var(--text-main); align-self: flex-start; border-bottom-left-radius: 4px; }
    .msg.user { background: var(--primary); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
    .composer { display: flex; gap: 12px; padding: 16px; border-top: 1px solid var(--border); }
    .composer input { flex: 1; background: var(--bg); border: 1px solid transparent; padding: 12px 16px; border-radius: 12px; font-size: 15px; }
    .composer input:focus { outline: none; border-color: var(--primary); background: var(--surface); box-shadow: 0 0 0 3px rgba(255, 90, 95, 0.1); }
    .composer button { background: var(--text-main); color: white; border: none; font-weight: 600; padding: 0 24px; border-radius: 12px; cursor: pointer; font-size: 15px; }
    .composer button:disabled { background: #9CA3AF; cursor: not-allowed; }
    .cart-section { width: 350px; flex-shrink: 0; padding: 24px; display: flex; flex-direction: column; overflow-y: auto; position: relative; }
    .cart-section h2 { font-weight: 700; font-size: 18px; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
    .line-item { display: flex; justify-content: space-between; margin: 12px 0; font-size: 14px; font-weight: 500; }
    .total-row { display: flex; justify-content: space-between; font-weight: 700; font-size: 18px; margin-top: 20px; border-top: 2px dashed var(--border); padding-top: 16px; }
    #payment-section { display: none; margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--border); text-align: center; }
    .qr-container { background: white; padding: 8px; border-radius: 12px; border: 1px solid var(--border); display: inline-block; margin-bottom: 16px; }
    .gpay-btn { display: block; width: 100%; background: var(--primary); color: white; padding: 14px; border-radius: 12px; font-weight: 600; text-decoration: none; margin-bottom: 12px; }
    .confirm-btn { display: block; width: 100%; background: var(--success); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 600; cursor: pointer; }
    .confirm-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .stamp { display: none; background: #ECFDF5; color: var(--success); border: 1px solid #A7F3D0; font-weight: 600; font-size: 14px; padding: 10px; border-radius: 6px; text-align: center; margin-bottom: 16px; }
    @media (max-width: 820px) { .layout { flex-direction: column; padding: 16px; height: auto; gap: 16px; } .chat-section { height: 60vh; min-height: 400px; } .cart-section { width: 100%; overflow-y: visible; } .sub { display: none; } }
  </style>
</head>
<body>

<header>
  <div class="brand">🍔 QuickBite</div>
  <div class="sub">AI Assistant</div>
</header>

<div class="layout">
  <div class="card chat-section">
    <div class="messages" id="messages"></div>
    <div class="composer">
      <input id="input" type="text" placeholder="Type your order..." autocomplete="off"/>
      <button id="send">Send</button>
    </div>
  </div>

  <div class="card cart-section">
    <div class="stamp" id="stamp">✓ ORDER SUCCESSFULLY PAID!</div>
    <h2>Order Summary</h2>
    <div id="cart-lines"><p style="color:#9CA3AF; font-style: italic; font-size: 14px;">Your cart is empty.</p></div>
    
    <div class="total-row">
      <span>Total</span>
      <span id="total">₹0</span>
    </div>

    <div id="payment-section">
      <p style="margin-bottom:12px; font-weight:600;">Scan or tap to complete payment</p>
      <div class="qr-container">
        <img id="qr-img" src="" alt="UPI QR" style="width:140px; height:140px; display:block;" />
      </div>
      <a id="gpay-link" href="#" class="gpay-btn">Pay with UPI App</a>
      <button id="confirm-pay-btn" class="confirm-btn">I Have Paid (Confirm Order)</button>
    </div>
  </div>
</div>

<script>
  const BACKEND_URL = "https://quickbite-agent.onrender.com";
  const sessionId = crypto.randomUUID ? crypto.randomUUID() : String(Math.random());

  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const cartLinesEl = document.getElementById("cart-lines");
  const totalEl = document.getElementById("total");
  const paymentSection = document.getElementById("payment-section");
  const qrImg = document.getElementById("qr-img");
  const gpayLink = document.getElementById("gpay-link");
  const confirmPayBtn = document.getElementById("confirm-pay-btn");
  const stampEl = document.getElementById("stamp");

  let currentOrder = null;
  let latestCustomerDetails = {};

  function addMessage(text, who) {
    const div = document.createElement("div");
    div.className = "msg " + who;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
  }

  function renderCart(cart, total) {
    cartLinesEl.innerHTML = "";
    if (!cart || !cart.length) {
      cartLinesEl.innerHTML = '<p style="color:#9CA3AF; font-style: italic; font-size: 14px;">Your cart is empty.</p>';
    } else {
      cart.forEach(item => {
        const row = document.createElement("div");
        row.className = "line-item";
        row.innerHTML = `<span>${item.qty}x ${item.name}</span><span>₹${item.price * item.qty}</span>`;
        cartLinesEl.appendChild(row);
      });
    }
    totalEl.textContent = "₹" + total;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    
    addMessage(text, "user");
    inputEl.value = "";
    sendBtn.disabled = true;
    sendBtn.textContent = "...";

    try {
      const res = await fetch(`${BACKEND_URL}/api/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId, message: text })
      });
      
      const data = await res.json();
      
      if (data.error) {
        addMessage("Connection error: " + data.error, "bot");
      } else {
        addMessage(data.reply, "bot");
        renderCart(data.cart, data.total);
        
        if (data.customerDetails) {
            latestCustomerDetails = { ...latestCustomerDetails, ...data.customerDetails };
        }

        if (data.readyToCheckout) {
          triggerCheckout();
        }
      }
    } catch (e) {
      addMessage("Connection error to server. Please try again.", "bot");
    } finally {
      sendBtn.disabled = false;
      sendBtn.textContent = "Send";
      if (window.innerWidth > 820) inputEl.focus();
    }
  }

  async function triggerCheckout() {
    try {
      const res = await fetch(`${BACKEND_URL}/api/checkout`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId, customerDetails: latestCustomerDetails })
      });
      const data = await res.json();
      if (data.error) return alert(data.error);

      currentOrder = data;
      qrImg.src = data.qrCodeUrl;
      gpayLink.href = data.upiUrl;
      paymentSection.style.display = "block";
      stampEl.style.display = "none"; 
      
      if (window.innerWidth <= 820) {
        setTimeout(() => paymentSection.scrollIntoView({ behavior: 'smooth' }), 300);
      }

      addMessage("Got it! Please complete your payment below so we can start your order.", "bot");
    } catch (e) {
      console.error(e);
    }
  }

  // Active Click Handler for Payment Confirmation
  confirmPayBtn.onclick = async () => {
    if (!currentOrder) return;
    confirmPayBtn.disabled = true;
    confirmPayBtn.textContent = "Verifying...";

    try {
      const res = await fetch(`${BACKEND_URL}/api/confirm-payment`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ orderId: currentOrder.orderId })
      });
      const data = await res.json();
      
      if (data.status === "SUCCESS") {
        stampEl.style.display = "block";
        paymentSection.style.display = "none";
        renderCart([], 0); // Visually clear the cart UI on success
        addMessage("🎉 Payment confirmed! We've received your order and have cleared your cart.", "bot");
      } else {
        alert("Failed to confirm payment.");
        confirmPayBtn.disabled = false;
        confirmPayBtn.textContent = "I Have Paid (Confirm Order)";
      }
    } catch (e) {
      alert("Error confirming payment: " + e.message);
      confirmPayBtn.disabled = false;
      confirmPayBtn.textContent = "I Have Paid (Confirm Order)";
    }
  };

  sendBtn.onclick = sendMessage;
  inputEl.onkeydown = (e) => { if (e.key === "Enter") sendMessage(); };

  addMessage("Welcome to QuickBite! What would you like to order today?", "bot");
</script>
</body>
</html>
